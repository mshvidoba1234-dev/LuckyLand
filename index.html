<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>იყიდება მიწის ნაკვეთი</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>იყიდება მიწის ნაკვეთი</h1>
    <p>სასწრაფოდ იყიდება საუკეთესო ადგილას! ყველა საჭირო დოკუმენტაციითა და კომუნიკაციით.</p>
    
    <h2>ფოტოგალერეა</h2>
    <div class="gallery">
        <img src="gate.jpg" alt="ჭიშკარი">
        <img src="land.jpg" alt="ნაკვეთი">
        <img src="road.jpg" alt="გზა">
        <img src="map.jpg" alt="რუკა">
        <img src="document.jpg" alt="დოკუმენტი">
    </div>
</div>

</body>
</html>
